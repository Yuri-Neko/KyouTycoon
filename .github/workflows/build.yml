name: Build and test

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - name: Verify YAML configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          files = list(Path("src/main/resources").glob("*.yml"))
          assert files, "No YAML config files found"
          for file in files:
              with file.open(encoding="utf-8") as f:
                  yaml.safe_load(f)
              print(f"YAML OK: {file}")
          PY
      - name: Compile, test and build plugin
        run: gradle --no-daemon clean test build
      - name: Report JUnit failures
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path("build/test-results/test").glob("TEST-*.xml"))
          for report in reports:
              root = ET.parse(report).getroot()
              for case in root.iter("testcase"):
                  problem = case.find("failure")
                  if problem is None:
                      problem = case.find("error")
                  if problem is not None:
                      print(f"FAIL: {case.get('classname')}::{case.get('name')}")
                      print(problem.get("message", ""))
                      print((problem.text or "")[-5000:])
          PY
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: ignore