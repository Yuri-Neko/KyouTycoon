plugins { id 'java' }
group='id.kyou'
version='1.0.0'
java { toolchain { languageVersion=JavaLanguageVersion.of(21) } }
repositories { mavenCentral(); maven { url='https://repo.papermc.io/repository/maven-public/' } }
dependencies { compileOnly 'io.papermc.paper:paper-api:1.21.8-R0.1-SNAPSHOT'; implementation 'org.xerial:sqlite-jdbc:3.50.3.0' }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release=21 }
processResources { filesMatching('plugin.yml') { expand(version: project.version) } }
